name: CI

on:
  push:
    # Las ramas de trabajo también se validan: sin esto hay que lanzar el workflow a mano
    # hasta que existe el PR, y un fallo de compilación se descubre tarde.
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  # Un push nuevo sobre la misma rama cancela el run anterior: no tiene sentido gastar
  # minutos (sobre todo de macOS) validando un commit que ya está superado.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  core-kotlin:
    name: Core Kotlin (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # `core` es un build independiente: sus tests no necesitan el SDK de Android.
      - name: Tests del core
        working-directory: android/core
        run: ./gradlew --no-daemon test

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-kotlin-test-results
          path: android/core/build/reports/tests/test
          if-no-files-found: ignore

  android-apps:
    name: Apps Android (móvil + Wear OS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          # El build raíz no lleva wrapper porque no se puede generar sin resolver el
          # Android Gradle Plugin; la versión se fija aquí.
          gradle-version: "8.14.3"

      # El SDK de Android viene preinstalado en el runner de ubuntu, y AGP lo encuentra
      # por ANDROID_HOME sin necesidad de local.properties.
      - name: Compilar apps
        working-directory: android
        run: gradle --no-daemon :mobile:assembleDebug :wear:assembleDebug

  # Los dos trabajos de macOS solo corren si el cambio toca algo de Apple. Un runner de
  # macOS gasta **10 veces** más minutos que uno de Linux, y validar el lado Apple al
  # cambiar un README o el módulo de Wear no aporta nada. Con esto una rama que solo
  # toca Android o documentación no gasta cuota de macOS.
  cambios:
    name: Qué ha cambiado
    runs-on: ubuntu-latest
    outputs:
      apple: ${{ steps.filtro.outputs.apple }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Hace falta el commit anterior para poder comparar.
          fetch-depth: 2

      - id: filtro
        name: Buscar cambios en el lado Apple
        run: |
          # En el primer commit de una rama no hay padre con el que comparar: se asume
          # que sí hay cambios, que es el lado seguro.
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "apple=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only HEAD^ HEAD | grep -qE '^(ios/|\.github/workflows/)'; then
            echo "apple=true" >> "$GITHUB_OUTPUT"
          else
            echo "apple=false" >> "$GITHUB_OUTPUT"
          fi

  core-swift:
    name: Core Swift (tests)
    needs: cambios
    if: needs.cambios.outputs.apple == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests de PadelCore
        run: swift test --package-path ios/Packages/PadelCore

  apple-apps:
    name: Apps Apple (iOS + watchOS)
    needs: cambios
    if: needs.cambios.outputs.apple == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      # El .xcodeproj no está versionado: se genera desde ios/project.yml.
      - name: Generar proyecto
        working-directory: ios
        run: xcodegen generate

      # Sin firmar: en CI solo interesa que compile, no producir un binario instalable.
      - name: Compilar iOS + watchOS
        working-directory: ios
        run: |
          xcodebuild build \
            -project RisingPadel.xcodeproj \
            -scheme RisingPadel \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
