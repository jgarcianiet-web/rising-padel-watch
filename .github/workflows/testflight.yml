# Compila la app de iPhone (con la del reloj embebida) y la sube a TestFlight.
#
# Existe para poder desarrollar para Apple Watch **sin tener un Mac**: los runners de
# GitHub Actions lo son. Ver `docs/testflight.md` para sacar los secretos sin un Mac.
#
# No corre en cada push a propósito: gasta minutos de macOS (que cuentan x10) y cada
# ejecución sube una build a App Store Connect. Se lanza a mano cuando quieres probar.
name: TestFlight

on:
  workflow_dispatch:
    inputs:
      notas:
        description: Qué probar en esta build (sale en TestFlight)
        required: false
        default: Build de desarrollo

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  build:
    name: Compilar y subir
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto
        working-directory: ios
        run: xcodegen generate

      # El certificado se importa en un llavero temporal en vez de dejar que Xcode cree
      # uno nuevo: los certificados de distribución están limitados a 3 por cuenta, y un
      # runner nuevo en cada ejecución los agotaría en tres builds.
      - name: Importar el certificado de distribución
        env:
          CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN=$RUNNER_TEMP/firma.keychain-db
          # Contraseña de un llavero efímero que se destruye con el runner.
          KEYCHAIN_PASSWORD=$(uuidgen)

          echo -n "$CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/distribucion.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import $RUNNER_TEMP/distribucion.p12 \
            -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN"
          # Sin esto, xcodebuild se queda esperando un diálogo de autorización que en un
          # runner sin pantalla no responde nadie, y el job muere por timeout.
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

      # La clave de App Store Connect sirve para dos cosas: que Xcode cree y descargue
      # los perfiles de aprovisionamiento solo, y para subir la build al final.
      - name: Preparar la clave de App Store Connect
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p $RUNNER_TEMP/claves
          echo -n "$APPSTORE_PRIVATE_KEY" > $RUNNER_TEMP/claves/AuthKey_$APPSTORE_KEY_ID.p8

      - name: Archivar
        working-directory: ios
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project RisingPadel.xcodeproj \
            -scheme RisingPadel \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/RisingPadel.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath $RUNNER_TEMP/claves/AuthKey_$APPSTORE_KEY_ID.p8 \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      # `destination: upload` hace que exportArchive suba directamente, sin pasar por
      # altool, que Apple lleva años amenazando con retirar.
      - name: Escribir ExportOptions
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

      - name: Exportar y subir a TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/RisingPadel.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath $RUNNER_TEMP/claves/AuthKey_$APPSTORE_KEY_ID.p8 \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

      # El log del archivado es lo único que sirve para diagnosticar un fallo de firma,
      # y sin esto se pierde con el runner.
      - name: Guardar los logs si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-xcodebuild
          path: |
            ~/Library/Logs/gym
            ${{ runner.temp }}/RisingPadel.xcarchive/Info.plist
          if-no-files-found: ignore

      - name: Limpiar el llavero
        if: always()
        run: security delete-keychain $RUNNER_TEMP/firma.keychain-db || true
