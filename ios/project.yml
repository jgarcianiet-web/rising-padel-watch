# Proyecto generado con XcodeGen: `cd ios && xcodegen generate`.
#
# El .xcodeproj no se versiona a propósito. Un pbxproj es imposible de revisar en un
# diff y provoca conflictos en cuanto dos personas tocan ficheros distintos; este YAML
# sí se lee y se revisa.
name: RisingPadel

options:
  bundleIdPrefix: com.risingpadel
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

packages:
  PadelCore:
    path: Packages/PadelCore

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "" # Rellenar con el Team ID antes de firmar.

targets:

  RisingPadel:
    type: application
    platform: iOS
    sources:
      - path: RisingPadel
    dependencies:
      - package: PadelCore
      - target: RisingPadelWatch
        embed: true
    info:
      path: RisingPadel/Info.plist
      properties:
        CFBundleDisplayName: Rising Padel
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Sin esto, cada build se queda parada en App Store Connect esperando a que
        # alguien responda a mano el cuestionario de cifrado de exportación, y hasta
        # entonces los probadores no la ven.
        #
        # `false` significa "no usa cifrado no exento", que es el caso: la app solo habla
        # HTTPS con la liga usando el cliente del sistema, y guarda el token en el
        # Llavero. Ni criptografía propia ni bibliotecas de cifrado.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.risingpadel.watch
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # Sin este ajuste el catálogo compila pero CFBundleIconName no llega al
        # Info.plist, y App Store Connect rechaza la build por falta de icono.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Solo iPhone. Declararse en iPad exige icono de 152 px y todas las
        # orientaciones, y la app está pensada para la muñeca y el bolsillo.
        TARGETED_DEVICE_FAMILY: 1
      configs:
        # Firma manual solo en Release, que es lo que archiva CI. La automática
        # archiva con un perfil de desarrollo, que exige un dispositivo registrado
        # en el equipo; los perfiles de App Store no, y los crea el propio workflow
        # (.github/scripts/preparar_perfiles.py). Debug queda en automático para
        # poder desarrollar desde Xcode con un Mac.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: RisingPadel AppStore

  RisingPadelWatch:
    type: application
    platform: watchOS
    sources:
      - path: RisingPadelWatch
    dependencies:
      - package: PadelCore
    info:
      path: RisingPadelWatch/Info.plist
      properties:
        CFBundleDisplayName: Rising Padel
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.risingpadel.watch
        WKRunsIndependentlyOfCompanionApp: true
        # HealthKit pide justificar el acceso en el propio Info.plist; sin estas dos
        # cadenas la app ni siquiera puede pedir permiso.
        NSHealthShareUsageDescription: >-
          Rising Padel lee tu frecuencia cardiaca y las calorías del entrenamiento para
          mostrarte el esfuerzo de cada partido. Solo se comparten con tu liga si tú lo
          activas en los ajustes.
        NSHealthUpdateUsageDescription: >-
          Rising Padel guarda el partido como entrenamiento en Salud para que cuente en
          tus anillos de actividad.
        NSMotionUsageDescription: >-
          Rising Padel usa el acelerómetro y el giróscopo de la muñeca para contar tus
          golpeos. Estos datos no salen del reloj.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.risingpadel.watch.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Misma razón que en el target de iOS: ver el comentario de arriba.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: RisingPadelWatch AppStore
    entitlements:
      path: RisingPadelWatch/RisingPadelWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
