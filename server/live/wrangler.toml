# El servidor del marcador en vivo (y buzón de sesiones), como Cloudflare Worker.
#
# Servicio gestionado a propósito: sin máquina que mantener, con plan gratuito que
# sobra para una liga personal (100.000 peticiones/día), y un almacén clave-valor
# que es exactamente lo que pide el contrato — el estado en vivo ES un valor por clave.
#
# Pasos de despliegue en el README de esta carpeta.
name = "rising-padel-live"
main = "src/index.js"
compatibility_date = "2026-08-01"

[[kv_namespaces]]
binding = "LIVE"
# Sustituir por el id que devuelve `wrangler kv namespace create LIVE`.
id = "PON_AQUI_EL_ID_DEL_NAMESPACE"

# La comunidad (usuarios, seguir, muro). Crear con `wrangler d1 create rising-padel`
# y aplicar el esquema: `wrangler d1 execute rising-padel --file=schema.sql --remote`.
[[d1_databases]]
binding = "DB"
database_name = "rising-padel"
database_id = "PON_AQUI_EL_ID_DE_D1"

# Secretos (wrangler secret put <NOMBRE>):
#   LIVE_TOKEN     token clásico de escritura (opcional una vez hay comunidad)
#   APNS_KEY_P8    contenido del AuthKey_XXX.p8 de App Store Connect (el mismo de CI)
#   APNS_KEY_ID    su Key ID
#   APNS_TEAM_ID   el Team ID de Apple
#   ANTHROPIC_API_KEY  la clave del SERVICIO para el entrenador IA. Sin ella el
#                      endpoint /v1/coach devuelve 404 y la app cae a la clave que
#                      ponga el usuario. Con ella, el usuario no necesita ninguna —
#                      que es lo que hace vendible la app. Cuota por cuenta y mes
#                      en la tabla coach_usage; ver src/coach.js.
#   APPSTORE_IAP_KEY_P8  contenido del AuthKey_XXX.p8 de la clave de **In-App Purchase**
#                        (App Store Connect → Usuarios y acceso → Claves → Compras
#                        dentro de la app). OJO: no es la misma clave que APNS_KEY_P8 ni
#                        la de subir builds; la App Store Server API solo acepta esta.
#   APPSTORE_IAP_KEY_ID  su Key ID
#   APPSTORE_ISSUER_ID   el Issuer ID de App Store Connect (el UUID de la pestaña Claves;
#                        no es el Team ID)
#   APPSTORE_BUNDLE_ID   com.risingpadel.watch — va dentro del JWT, y Apple contesta 401
#                        si no coincide con el de la clave.
# Sin los cuatro, /v1/suscripcion devuelve 404 y la app se queda en el plan gratuito:
# una suscripción que no se puede comprobar con Apple no se concede. Ver
# src/suscripciones.js, y apunta la URL del webhook de App Store Server Notifications V2
# (App Store Connect → tu app → Notificaciones de servidor) a
# https://<tu-worker>/v1/suscripcion/apple.
# Y una variable normal:
# Las fotos del muro. Crear con `wrangler r2 bucket create rising-padel-fotos`
# (R2 hay que activarlo una vez en el panel de Cloudflare; el plan gratuito llega).
[[r2_buckets]]
binding = "FOTOS"
bucket_name = "rising-padel-fotos"

# ── Dominio propio (para comercializar) ──
# El workers.dev es largo y de prestado. Con un dominio en Cloudflare (Registrar,
# ~10 €/año), se descomenta esto y la URL pasa a ser https://api.tudominio.com:
#   1. Compra el dominio en el panel (Registrar → Register domain).
#   2. Descomenta y pon tu dominio; empuja: el deploy lo engancha solo.
#   3. Cambia `servidorOficial` en ComunidadView.swift a la URL nueva.
# [[routes]]
# pattern = "api.tudominio.com"
# custom_domain = true

[vars]
APNS_TOPIC = "com.risingpadel.watch"

# Quién es el DUEÑO del servicio y no un cliente suyo: alias separados por comas.
#
# El dueño tiene el plan más alto sin comprar nada, porque la clave de Anthropic que se
# paga en cada pregunta al entrenador es la suya — pedirle que se suscriba a sí mismo
# para usar lo que él paga no es una regla de negocio, es un error.
#
# **Normalmente no hace falta tocar esto**: la cuenta número 1 de la base de datos es el
# dueño automáticamente, y esa es la del que levantó el servidor. Esta variable es para
# cuando la cuenta 1 no es la buena (una base migrada, una cuenta de prueba creada
# antes). Va aquí y no en `wrangler secret` a propósito: un alias no es una credencial,
# y sin el token de esa cuenta no abre nada. Ver `esPropietario()` en src/comunidad.js.
# PROPIETARIO = "tu-alias"
