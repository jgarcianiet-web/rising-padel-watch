# El servidor del marcador en vivo (y buzón de sesiones), como Cloudflare Worker.
#
# Servicio gestionado a propósito: sin máquina que mantener, con plan gratuito que
# sobra para una liga personal (100.000 peticiones/día), y un almacén clave-valor
# que es exactamente lo que pide el contrato — el estado en vivo ES un valor por clave.
#
# Pasos de despliegue en el README de esta carpeta.
name = "rising-padel-live"
main = "src/index.js"
compatibility_date = "2026-08-01"

[[kv_namespaces]]
binding = "LIVE"
# Sustituir por el id que devuelve `wrangler kv namespace create LIVE`.
id = "PON_AQUI_EL_ID_DEL_NAMESPACE"

# La comunidad (usuarios, seguir, muro). Crear con `wrangler d1 create rising-padel`
# y aplicar el esquema: `wrangler d1 execute rising-padel --file=schema.sql --remote`.
[[d1_databases]]
binding = "DB"
database_name = "rising-padel"
database_id = "PON_AQUI_EL_ID_DE_D1"

# Secretos (wrangler secret put <NOMBRE>):
#   LIVE_TOKEN     token clásico de escritura (opcional una vez hay comunidad)
#   APNS_KEY_P8    contenido del AuthKey_XXX.p8 de App Store Connect (el mismo de CI)
#   APNS_KEY_ID    su Key ID
#   APNS_TEAM_ID   el Team ID de Apple
# Y una variable normal:
# Las fotos del muro. Crear con `wrangler r2 bucket create rising-padel-fotos`
# (R2 hay que activarlo una vez en el panel de Cloudflare; el plan gratuito llega).
[[r2_buckets]]
binding = "FOTOS"
bucket_name = "rising-padel-fotos"

# ── Dominio propio (para comercializar) ──
# El workers.dev es largo y de prestado. Con un dominio en Cloudflare (Registrar,
# ~10 €/año), se descomenta esto y la URL pasa a ser https://api.tudominio.com:
#   1. Compra el dominio en el panel (Registrar → Register domain).
#   2. Descomenta y pon tu dominio; empuja: el deploy lo engancha solo.
#   3. Cambia `servidorOficial` en ComunidadView.swift a la URL nueva.
# [[routes]]
# pattern = "api.tudominio.com"
# custom_domain = true

[vars]
APNS_TOPIC = "com.risingpadel.watch"
